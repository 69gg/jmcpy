[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jmcpy"
version = "0.1.0"
description = "禁漫天堂 Python SDK：搜索、评论、分类排行、章节详情与图片下载解码"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["jmcomic", "18comic", "禁漫天堂", "sdk", "crawler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "curl-cffi>=0.11",
    "pillow>=10",
    "cryptography>=42",
    "platformdirs>=4",
]

[project.optional-dependencies]
# 传输层回退实现（默认使用 curl-cffi 的浏览器指纹伪装）
httpx = ["httpx>=0.27"]
# 把会话加密密钥交给操作系统钥匙串保管
keyring = ["keyring>=24"]
all = ["httpx>=0.27", "keyring>=24"]

# 开发依赖用 PEP 735 的依赖组：uv run / uv sync 默认就会装上，
# 不会像 optional-extra 那样在下一次 uv run 时被当成多余的包清掉。
[dependency-groups]
dev = [
    # 测试要用到两种传输后端与钥匙串分支
    "httpx>=0.27",
    "keyring>=24",
    "mypy>=1.14",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jmcpy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3：中文注释与文案里的全角标点会被判为「易混淆字符」，本项目大量使用中文，忽略
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: 需要真实网络访问，默认跳过（设置 JMCPY_LIVE=1 开启）"]
