name: 发布到 PyPI

# 只有推送 v 开头的标签才会触发；标签所指的提交必须已经在 main 上。
# 发布用的是 PyPI 的「受信发布（Trusted Publishing）」：走 OIDC 换取短期凭据，
# 仓库里不需要保存任何令牌。配置步骤见 docs/releasing.md。
on:
  push:
    tags:
      - "v*"

# 默认最小权限，任务里再按需放开
permissions:
  contents: read

jobs:
  publish:
    name: 构建并发布
    runs-on: ubuntu-latest
    # 与 PyPI 受信发布里填的 Environment name 保持一致
    environment: pypi
    permissions:
      contents: write # 创建 GitHub Release
      id-token: write # 向 PyPI 换取发布凭据（OIDC）
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整历史来确认标签打在 main 上

      - name: 安装 uv
        # setup-uv 不提供浮动的大版本标签，按官方建议固定到具体提交
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: 确认标签打在 main 上
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::标签 ${GITHUB_REF_NAME} 指向的提交不在 main 上，拒绝发布"
            exit 1
          fi
          echo "标签 ${GITHUB_REF_NAME} 指向 main 上的提交 $GITHUB_SHA"

      - name: 校验标签与 pyproject 里的版本号一致
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 pyproject.toml 的版本 ${version} 不一致，请先改版本号再打标签"
            exit 1
          fi
          echo "版本号一致: ${version}"

      - name: 跑离线测试
        run: uv run --frozen pytest -q

      - name: 构建
        run: uv build

      - name: 发布到 PyPI
        # --check-url：已存在的文件会被跳过，重跑失败的工作流不会因为「文件已存在」而卡住
        run: |
          set -euo pipefail
          uv publish \
            --trusted-publishing always \
            --check-url "https://pypi.org/simple/${GITHUB_REPOSITORY##*/}/"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
